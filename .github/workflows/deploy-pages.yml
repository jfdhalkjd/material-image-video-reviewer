name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pages
          cp -R dist/. /tmp/pages/
          # 给飞书侧边栏一个全新的路径，绕过旧 iframe 缓存；后续更新仍固定使用此路径。
          mkdir -p /tmp/pages/v2
          cp -R dist/. /tmp/pages/v2/
          mkdir -p /tmp/pages/v3
          cp -R dist/. /tmp/pages/v3/
          mkdir -p /tmp/pages/v4
          cp -R dist/. /tmp/pages/v4/
          mkdir -p /tmp/pages/v5
          cp -R dist/. /tmp/pages/v5/
          mkdir -p /tmp/pages/v6
          cp -R dist/. /tmp/pages/v6/
          mkdir -p /tmp/pages/v7
          cp -R dist/. /tmp/pages/v7/
          mkdir -p /tmp/pages/v8
          cp -R dist/. /tmp/pages/v8/
          mkdir -p /tmp/pages/v9
          cp -R dist/. /tmp/pages/v9/
          cd /tmp/pages
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy website"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
